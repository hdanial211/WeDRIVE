<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cars Management | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png" />
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/wedrive.css" />
  <script src="../../../shared/js/auth-guard.js" data-role="admin"></script>
</head>

<body data-particles="6" data-cursor-glow>
  <div id="sidebar-placeholder" data-component="sidebar-admin" data-page="car-all"></div>

  <main class="main">
    <div id="navbar-placeholder" data-module="admin"></div>

    <div class="content">
      <!-- STATS -->
      <div class="stats-grid grid-3col">
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="fl_stat_total">Total Cars</div>
            <div class="value" id="fl-total">--</div>
          </div>
          <div class="stat-icon blue"><span class="material-icons-round">directions_car</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="fl_stat_available">Available</div>
            <div class="value" id="fl-available">--</div>
          </div>
          <div class="stat-icon green"><span class="material-icons-round">check_circle</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="fl_stat_rented">Rented</div>
            <div class="value" id="fl-rented">--</div>
          </div>
          <div class="stat-icon amber"><span class="material-icons-round">car_rental</span></div>
        </div>
      </div>

      <!-- FILTER + SEARCH + ACTIONS -->
      <div class="card reveal-on-scroll mb-20 px-22 py-16">
        <div class="flex-between gap-12 flex-wrap">
          <div class="flex-center gap-8 flex-wrap">
            <button class="filter-chip active" onclick="filterCar('all', this)">All</button>
            <button class="filter-chip" onclick="filterCar('Available', this)">Available</button>
            <button class="filter-chip" onclick="filterCar('Rented', this)">Rented</button>
          </div>
          <div class="flex-center gap-10">
            <div class="input-wrap-sm input-search-fixed">
              <span class="material-icons-round fs-18">search</span>
              <input type="text" id="fl-search" placeholder="Search car name or plate..."
                oninput="searchCar(this.value)" />
            </div>
            <button class="btn-outline-sm" id="car-view-toggle-btn" onclick="toggleCarView()" title="Toggle between List and Grid view">
              <span class="material-icons-round fs-16">view_list</span> List View
            </button>
            <button class="btn-primary-sm" onclick="addNewCar()" title="Add new car">
              <span class="material-icons-round fs-16">add</span>
              <span data-key="fl_add_car">Add Car</span>
            </button>
          </div>
        </div>
      </div>

      <!-- CAR CARDS GRID -->
      <div id="car-grid" class="car-grid">
        <!-- Populated by cars.js -->
      </div>

      <!-- CAR TABLE LIST VIEW (In-page responsive Apple table) -->
      <div id="car-list-container" class="card reveal-on-scroll hidden table-responsive p-0 radius-20">
        <table class="car-admin-table">
          <thead>
            <tr class="car-table-header-row">
              <th class="car-th" data-key="fl_th_vehicle">Vehicle</th>
              <th class="car-th" data-key="fl_th_plate">Plate No.</th>
              <th class="car-th" data-key="fl_th_type">Type</th>
              <th class="car-th" data-key="fl_th_seats">Seats</th>
              <th class="car-th" data-key="fl_th_trans">Transmission</th>
              <th class="car-th" data-key="fl_th_fuel">Fuel</th>
              <th class="car-th" data-key="fl_th_rate">Daily Rate</th>
              <th class="car-th" data-key="fl_th_status">Status</th>
              <th class="car-th text-right" data-key="fl_th_action">Action</th>
            </tr>
          </thead>
          <tbody id="car-tbody"></tbody>
        </table>
      </div>

      <!-- FOOTER -->
      <div id="footer-placeholder" class="mt-32"></div>
    </div>
  </main>

  <!-- CARS LIST MODAL -->
  <div id="cars-list-modal" class="modal-overlay hidden">
    <div class="modal-container modal-wide">
      <div class="modal-header">
        <h3><span class="material-icons-round fs-20 va-middle mr-6">list_alt</span> Cars List</h3>
        <button class="modal-close-btn" onclick="closeCarListModal()">
          <span class="material-icons-round">close</span>
        </button>
      </div>
      <div class="modal-body table-responsive">
        <table>
          <thead>
            <tr>
              <th data-key="fl_th_vehicle">Vehicle</th>
              <th data-key="fl_th_plate">Plate No.</th>
              <th data-key="fl_th_type">Type</th>
              <th data-key="fl_th_seats">Seats</th>
              <th data-key="fl_th_trans">Transmission</th>
              <th data-key="fl_th_fuel">Fuel</th>
              <th data-key="fl_th_rate">Daily Rate</th>
              <th data-key="fl_th_status">Status</th>
              <th data-key="fl_th_action">Action</th>
            </tr>
          </thead>
          <tbody id="car-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../../shared/js/navbar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/sidebar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/anime.min.js"></script>
  <script src="../../../shared/js/animate.js"></script>
  <script src="../../js/cars.js?v=5.2.16"></script>
  <script src="../../js/admin-idle-timeout.js?v=5.2.77"></script>
</body>

</html>

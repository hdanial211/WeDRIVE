<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Cars | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png" />
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/wedrive.css?v=5.4.0" />
  <!-- AUTH GUARD: Must run before page renders -->
  <script src="../../../shared/js/auth-guard.js?v=5.2.3" data-role="admin"></script>
</head>

<body data-particles="6" data-cursor-glow>
  <!-- SIDEBAR (Contextual Sub-Main Navigation) -->
  <div id="sidebar-placeholder" data-component="sidebar-admin" data-page="car-available"></div>

  <!-- MAIN -->
  <main class="main">
    <!-- TOPBAR (Main Navigation) -->
    <div id="navbar-placeholder" data-module="admin"></div>

    <div class="content">
      <!-- HEADER BANNER -->
      <div class="card reveal-onload mb-20 p-24">
        <div class="flex-between flex-wrap gap-16">
          <div>
            <div class="flex-center gap-8 mb-6">
              <span class="status-badge success"><span class="dot"></span> Ready For Immediate Rental</span>
              <span class="fs-12 text-muted" id="avail-count-badge">-- unit sedia</span>
            </div>
            <h1 class="fs-26 fw-800 m-0 text-title" data-key="sidebar_available_cars">Kenderaan Tersedia</h1>
            <p class="text-secondary fs-14 m-0 mt-4">Senarai kenderaan yang telah diperiksa, disanitasi, dan sedia untuk tempahan pelanggan.</p>
          </div>
          <div class="flex-center gap-10">
            <button class="btn-outline-sm" onclick="window.location.href='cars.html'">
              <span class="material-icons-round fs-16">directions_car</span> Semua Kereta
            </button>
            <button class="btn-primary-sm" onclick="window.location.href='add-car.html'">
              <span class="material-icons-round fs-16">add</span> Tambah Kereta
            </button>
          </div>
        </div>
      </div>

      <!-- SEARCH + VIEW CONTROLS -->
      <div class="card reveal-on-scroll mb-20 px-22 py-16">
        <div class="flex-between gap-12 flex-wrap">
          <div class="flex-center gap-8 flex-wrap">
            <span class="fs-13 fw-600 text-muted">Kategori:</span>
            <button class="filter-chip active" onclick="filterCategory('all', this)">Semua</button>
            <button class="filter-chip" onclick="filterCategory('Sedan', this)">Sedan</button>
            <button class="filter-chip" onclick="filterCategory('SUV', this)">SUV</button>
            <button class="filter-chip" onclick="filterCategory('MPV', this)">MPV</button>
            <button class="filter-chip" onclick="filterCategory('Hatchback', this)">Hatchback</button>
          </div>
          <div class="flex-center gap-10">
            <div class="input-wrap-sm input-search-fixed">
              <span class="material-icons-round fs-18">search</span>
              <input type="text" id="avail-search" placeholder="Cari model atau plat nombor..." oninput="searchAvailable(this.value)" />
            </div>
            <button class="btn-outline-sm" id="avail-view-toggle" onclick="toggleAvailableView()" title="Tukar paparan Grid / Senarai">
              <span class="material-icons-round fs-16">view_list</span> Senarai
            </button>
          </div>
        </div>
      </div>

      <!-- CAR CARDS GRID -->
      <div id="avail-grid" class="car-grid">
        <!-- Populated dynamically -->
      </div>

      <!-- CAR TABLE LIST VIEW -->
      <div id="avail-list" class="card reveal-on-scroll hidden table-responsive p-0 radius-20">
        <table class="car-admin-table">
          <thead>
            <tr class="car-table-header-row">
              <th class="car-th">Kenderaan</th>
              <th class="car-th">Plat No.</th>
              <th class="car-th">Kategori</th>
              <th class="car-th">Kapasiti</th>
              <th class="car-th">Transmisi</th>
              <th class="car-th">Bahan Api</th>
              <th class="car-th">Kadar Harian</th>
              <th class="car-th">Status</th>
              <th class="car-th text-right">Tindakan</th>
            </tr>
          </thead>
          <tbody id="avail-tbody"></tbody>
        </table>
      </div>

      <!-- FOOTER -->
      <div id="footer-placeholder" class="mt-32"></div>
    </div>
  </main>

  <script src="../../../shared/js/navbar-loader.js?v=5.4.0"></script>
  <script src="../../../shared/js/sidebar-loader.js?v=5.4.0"></script>
  <script src="../../../shared/js/main.js?v=5.2.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js?v=5.2.3"></script>
  <script src="../../../shared/js/api.js?v=5.2.3"></script>
  <script src="../../../shared/js/anime.min.js"></script>
  <script src="../../../shared/js/animate.js?v=5.2.3"></script>
  <script src="../../js/admin-idle-timeout.js?v=5.2.77"></script>

  <script>
    var availableCars = [];
    var currentCat = 'all';
    var currentSearch = '';
    var viewMode = 'grid';

    function initAvailableCars() {
      window.WeDriveAPI.getAdminData()
        .then(function (data) {
          var allCars = data.car || [];
          availableCars = allCars.filter(function (c) {
            return (c.status || '').toLowerCase() === 'available';
          });

          var badgeEl = document.getElementById('avail-count-badge');
          if (badgeEl) badgeEl.textContent = availableCars.length + ' unit sedia disewa';
          renderAvailable();
        })
        .catch(function (err) {
          console.error('Error loading available cars:', err);
        });
    }

    function renderAvailable() {
      var filtered = availableCars.filter(function (car) {
        var matchCat = currentCat === 'all' || (car.type || '').toLowerCase() === currentCat.toLowerCase();
        var matchSearch = !currentSearch ||
          (car.name || '').toLowerCase().includes(currentSearch) ||
          (car.plate || '').toLowerCase().includes(currentSearch);
        return matchCat && matchSearch;
      });

      // Render Cards
      var gridEl = document.getElementById('avail-grid');
      if (filtered.length === 0) {
        gridEl.innerHTML = '<div class="card p-40 text-center text-muted col-span-full">Tiada kenderaan tersedia buat masa ini mengikut tapisan.</div>';
      } else {
        gridEl.innerHTML = filtered.map(function (car) {
          var img0 = (car.images && car.images.length > 0) ? car.images[0] : '';
          var src = img0 ? ((img0.startsWith('http') || img0.startsWith('data:')) ? img0 : '../../../shared/model/' + img0) : '../../../shared/model/bezza.png';
          var rateFormatted = car.rate ? (String(car.rate).startsWith('RM') ? car.rate : 'RM ' + car.rate + '/hari') : 'RM 150/hari';

          return '<div class="card reveal-onload p-18">' +
            '<div class="car-card-img-wrap">' +
              '<img src="' + src + '" alt="' + car.name + '" class="car-card-img" onerror="this.src=\'../../../shared/model/bezza.png\'" />' +
              '<span class="status-badge success car-card-badge"><span class="dot"></span> Tersedia</span>' +
            '</div>' +
            '<div class="car-card-body">' +
              '<div class="flex-between mb-8">' +
                '<h3 class="fs-16 fw-700 m-0">' + car.name + '</h3>' +
                '<span class="fs-12 fw-700 text-muted">' + (car.plate || '-') + '</span>' +
              '</div>' +
              '<div class="flex-wrap gap-8 fs-12 text-muted mb-14">' +
                '<span class="flex-center gap-4"><span class="material-icons-round fs-14">airline_seat_recline_normal</span> ' + (car.seats || 5) + ' Kerusi</span>' +
                '<span class="flex-center gap-4"><span class="material-icons-round fs-14">settings</span> ' + (car.transmission || 'Auto') + '</span>' +
                '<span class="flex-center gap-4"><span class="material-icons-round fs-14">local_gas_station</span> ' + (car.fuel || 'Petrol') + '</span>' +
              '</div>' +
              '<div class="flex-between border-top-subtle pt-12">' +
                '<div>' +
                  '<div class="fs-11 text-muted">Kadar Sewaan</div>' +
                  '<div class="fs-16 fw-800 text-primary-accent">' + rateFormatted + '</div>' +
                '</div>' +
                '<div class="flex-center gap-6">' +
                  '<button class="btn-outline-sm" onclick="window.location.href=\'car-detail/car-detail.html?id=' + (car.id || '') + '\'">Perincian</button>' +
                  '<button class="btn-primary-sm" onclick="window.location.href=\'../booking/new-booking.html?car=' + (car.id || '') + '\'">Tempah</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      // Render Table
      var tbody = document.getElementById('avail-tbody');
      if (tbody) {
        if (filtered.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" class="text-center py-24 text-muted">Tiada kenderaan sepadan.</td></tr>';
        } else {
          tbody.innerHTML = filtered.map(function (car) {
            var rateFormatted = car.rate ? (String(car.rate).startsWith('RM') ? car.rate : 'RM ' + car.rate + '/hari') : 'RM 150/hari';
            return '<tr>' +
              '<td><strong>' + car.name + '</strong></td>' +
              '<td><span class="fs-12 fw-700">' + (car.plate || '-') + '</span></td>' +
              '<td>' + (car.type || '-') + '</td>' +
              '<td>' + (car.seats || 5) + ' Tempat Duduk</td>' +
              '<td>' + (car.transmission || 'Auto') + '</td>' +
              '<td>' + (car.fuel || 'Petrol') + '</td>' +
              '<td><strong class="text-primary-accent">' + rateFormatted + '</strong></td>' +
              '<td><span class="status-badge success"><span class="dot"></span> Available</span></td>' +
              '<td class="text-right">' +
                '<button class="btn-outline-sm mr-6" onclick="window.location.href=\'car-detail/car-detail.html?id=' + (car.id || '') + '\'">Perincian</button>' +
                '<button class="btn-primary-sm" onclick="window.location.href=\'../booking/new-booking.html?car=' + (car.id || '') + '\'">Tempah</button>' +
              '</td>' +
            '</tr>';
          }).join('');
        }
      }
    }

    function filterCategory(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      renderAvailable();
    }

    function searchAvailable(val) {
      currentSearch = (val || '').trim().toLowerCase();
      renderAvailable();
    }

    function toggleAvailableView() {
      var gridEl = document.getElementById('avail-grid');
      var listEl = document.getElementById('avail-list');
      var btn = document.getElementById('avail-view-toggle');

      if (viewMode === 'grid') {
        viewMode = 'list';
        gridEl.style.display = 'none';
        listEl.style.display = 'block';
        btn.innerHTML = '<span class="material-icons-round fs-16">grid_view</span> Grid';
      } else {
        viewMode = 'grid';
        listEl.style.display = 'none';
        gridEl.style.display = 'grid';
        btn.innerHTML = '<span class="material-icons-round fs-16">view_list</span> Senarai';
      }
    }

    document.addEventListener('DOMContentLoaded', initAvailableCars);
  </script>
</body>

</html>

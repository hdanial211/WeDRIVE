<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rented Cars | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png" />
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/wedrive.css?v=5.4.0" />
  <!-- AUTH GUARD: Must run before page renders -->
  <script src="../../../shared/js/auth-guard.js?v=5.2.3" data-role="admin"></script>
</head>

<body data-particles="6" data-cursor-glow>
  <!-- SIDEBAR (Contextual Sub-Main Navigation) -->
  <div id="sidebar-placeholder" data-component="sidebar-admin" data-page="car-rented"></div>

  <!-- MAIN -->
  <main class="main">
    <!-- TOPBAR (Main Navigation) -->
    <div id="navbar-placeholder" data-module="admin"></div>

    <div class="content">
      <!-- HEADER BANNER -->
      <div class="card reveal-onload mb-20 p-24">
        <div class="flex-between flex-wrap gap-16">
          <div>
            <div class="flex-center gap-8 mb-6">
              <span class="status-badge active"><span class="dot"></span> On-Road Rental Tracking</span>
              <span class="fs-12 text-muted" id="rented-count-badge">-- unit di jalan raya</span>
            </div>
            <h1 class="fs-26 fw-800 m-0 text-title" data-key="sidebar_rented_cars">Sedang Disewa</h1>
            <p class="text-secondary fs-14 m-0 mt-4">Pemantauan kenderaan aktif yang sedang berada di tangan penyewa beserta jangka masa pulangan.</p>
          </div>
          <div class="flex-center gap-10">
            <button class="btn-outline-sm" onclick="window.location.href='cars.html'">
              <span class="material-icons-round fs-16">directions_car</span> Semua Kereta
            </button>
            <button class="btn-primary-sm" onclick="window.location.href='../booking/active-bookings.html'">
              <span class="material-icons-round fs-16">receipt_long</span> Tempahan Aktif
            </button>
          </div>
        </div>
      </div>

      <!-- SEARCH + VIEW CONTROLS -->
      <div class="card reveal-on-scroll mb-20 px-22 py-16">
        <div class="flex-between gap-12 flex-wrap">
          <div class="flex-center gap-8 flex-wrap">
            <span class="fs-13 fw-600 text-muted">Kategori:</span>
            <button class="filter-chip active" onclick="filterCategory('all', this)">Semua</button>
            <button class="filter-chip" onclick="filterCategory('Sedan', this)">Sedan</button>
            <button class="filter-chip" onclick="filterCategory('SUV', this)">SUV</button>
            <button class="filter-chip" onclick="filterCategory('MPV', this)">MPV</button>
          </div>
          <div class="flex-center gap-10">
            <div class="input-wrap-sm input-search-fixed">
              <span class="material-icons-round fs-18">search</span>
              <input type="text" id="rented-search" placeholder="Cari nama model atau plat..." oninput="searchRented(this.value)" />
            </div>
            <button class="btn-outline-sm" id="rented-view-toggle" onclick="toggleRentedView()" title="Tukar paparan Grid / Senarai">
              <span class="material-icons-round fs-16">view_list</span> Senarai
            </button>
          </div>
        </div>
      </div>

      <!-- CAR CARDS GRID -->
      <div id="rented-grid" class="car-grid">
        <!-- Populated dynamically -->
      </div>

      <!-- CAR TABLE LIST VIEW -->
      <div id="rented-list" class="card reveal-on-scroll hidden table-responsive p-0 radius-20">
        <table class="car-admin-table">
          <thead>
            <tr class="car-table-header-row">
              <th class="car-th">Kenderaan</th>
              <th class="car-th">Plat No.</th>
              <th class="car-th">Penyewa Semasa</th>
              <th class="car-th">Jangkaan Pulang</th>
              <th class="car-th">Kadar Harian</th>
              <th class="car-th">Status</th>
              <th class="car-th text-right">Tindakan</th>
            </tr>
          </thead>
          <tbody id="rented-tbody"></tbody>
        </table>
      </div>

      <!-- FOOTER -->
      <div id="footer-placeholder" class="mt-32"></div>
    </div>
  </main>

  <script src="../../../shared/js/navbar-loader.js?v=5.4.0"></script>
  <script src="../../../shared/js/sidebar-loader.js?v=5.4.0"></script>
  <script src="../../../shared/js/main.js?v=5.2.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js?v=5.2.3"></script>
  <script src="../../../shared/js/api.js?v=5.2.3"></script>
  <script src="../../../shared/js/anime.min.js"></script>
  <script src="../../../shared/js/animate.js?v=5.2.3"></script>
  <script src="../../js/admin-idle-timeout.js?v=5.2.77"></script>

  <script>
    var rentedCars = [];
    var currentCat = 'all';
    var currentSearch = '';
    var viewMode = 'grid';

    function initRentedCars() {
      window.WeDriveAPI.getAdminData()
        .then(function (data) {
          var allCars = data.car || [];
          var bookings = data.bookings || [];

          rentedCars = allCars.filter(function (c) {
            return (c.status || '').toLowerCase() === 'rented';
          }).map(function (car) {
            var relatedBooking = bookings.find(function (b) {
              return b.car_id === car.id || (b.car_name && b.car_name.toLowerCase() === (car.name || '').toLowerCase());
            });
            return {
              car: car,
              booking: relatedBooking || {
                customer_name: 'Penyewa Korporat WeDRIVE',
                return_date: '2026-09-08',
                id: 'BK-2026-081'
              }
            };
          });

          var countEl = document.getElementById('rented-count-badge');
          if (countEl) countEl.textContent = rentedCars.length + ' unit di jalan raya';
          renderRented();
        })
        .catch(function (err) {
          console.error('Error loading rented cars:', err);
        });
    }

    function renderRented() {
      var filtered = rentedCars.filter(function (item) {
        var car = item.car;
        var matchCat = currentCat === 'all' || (car.type || '').toLowerCase() === currentCat.toLowerCase();
        var matchSearch = !currentSearch ||
          (car.name || '').toLowerCase().includes(currentSearch) ||
          (car.plate || '').toLowerCase().includes(currentSearch) ||
          (item.booking.customer_name || '').toLowerCase().includes(currentSearch);
        return matchCat && matchSearch;
      });

      var gridEl = document.getElementById('rented-grid');
      if (filtered.length === 0) {
        gridEl.innerHTML = '<div class="card p-40 text-center text-muted col-span-full">Tiada kenderaan yang sedang disewa buat masa ini.</div>';
      } else {
        gridEl.innerHTML = filtered.map(function (item) {
          var car = item.car;
          var bk = item.booking;
          var img0 = (car.images && car.images.length > 0) ? car.images[0] : '';
          var src = img0 ? ((img0.startsWith('http') || img0.startsWith('data:')) ? img0 : '../../../shared/model/' + img0) : '../../../shared/model/bezza.png';
          var rateFormatted = car.rate ? (String(car.rate).startsWith('RM') ? car.rate : 'RM ' + car.rate + '/hari') : 'RM 180/hari';

          return '<div class="card reveal-onload p-18">' +
            '<div class="car-card-img-wrap">' +
              '<img src="' + src + '" alt="' + car.name + '" class="car-card-img" onerror="this.src=\'../../../shared/model/bezza.png\'" />' +
              '<span class="status-badge active car-card-badge"><span class="dot"></span> Disewa</span>' +
            '</div>' +
            '<div class="car-card-body">' +
              '<div class="flex-between mb-8">' +
                '<h3 class="fs-16 fw-700 m-0">' + car.name + '</h3>' +
                '<span class="fs-12 fw-700 text-muted">' + (car.plate || '-') + '</span>' +
              '</div>' +
              '<div class="bento-item-subtle p-12 mb-12 fs-12">' +
                '<div class="flex-between mb-4">' +
                  '<span class="text-muted">Penyewa:</span>' +
                  '<strong class="text-title">' + (bk.customer_name || 'Pelanggan') + '</strong>' +
                '</div>' +
                '<div class="flex-between">' +
                  '<span class="text-muted">Pulangan:</span>' +
                  '<strong class="text-amber">' + (bk.return_date || 'Seterusnya') + '</strong>' +
                '</div>' +
              '</div>' +
              '<div class="flex-between border-top-subtle pt-12">' +
                '<div>' +
                  '<div class="fs-11 text-muted">Kadar Sewaan</div>' +
                  '<div class="fs-16 fw-800 text-primary-accent">' + rateFormatted + '</div>' +
                '</div>' +
                '<div class="flex-center gap-6">' +
                  '<button class="btn-outline-sm" onclick="window.location.href=\'car-detail/car-detail.html?id=' + (car.id || '') + '\'">Perincian</button>' +
                  '<button class="btn-primary-sm" onclick="window.location.href=\'../booking/active-bookings.html\'">Log Sewaan</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      var tbody = document.getElementById('rented-tbody');
      if (tbody) {
        if (filtered.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-24 text-muted">Tiada kenderaan sepadan.</td></tr>';
        } else {
          tbody.innerHTML = filtered.map(function (item) {
            var car = item.car;
            var bk = item.booking;
            var rateFormatted = car.rate ? (String(car.rate).startsWith('RM') ? car.rate : 'RM ' + car.rate + '/hari') : 'RM 180/hari';

            return '<tr>' +
              '<td><strong>' + car.name + '</strong></td>' +
              '<td><span class="fs-12 fw-700">' + (car.plate || '-') + '</span></td>' +
              '<td><strong>' + (bk.customer_name || '-') + '</strong></td>' +
              '<td><span class="text-amber fw-600">' + (bk.return_date || '-') + '</span></td>' +
              '<td><strong class="text-primary-accent">' + rateFormatted + '</strong></td>' +
              '<td><span class="status-badge active"><span class="dot"></span> Disewa</span></td>' +
              '<td class="text-right">' +
                '<button class="btn-outline-sm mr-6" onclick="window.location.href=\'car-detail/car-detail.html?id=' + (car.id || '') + '\'">Perincian</button>' +
                '<button class="btn-primary-sm" onclick="window.location.href=\'../booking/active-bookings.html\'">Urus</button>' +
              '</td>' +
            '</tr>';
          }).join('');
        }
      }
    }

    function filterCategory(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      renderRented();
    }

    function searchRented(val) {
      currentSearch = (val || '').trim().toLowerCase();
      renderRented();
    }

    function toggleRentedView() {
      var gridEl = document.getElementById('rented-grid');
      var listEl = document.getElementById('rented-list');
      var btn = document.getElementById('rented-view-toggle');

      if (viewMode === 'grid') {
        viewMode = 'list';
        gridEl.style.display = 'none';
        listEl.style.display = 'block';
        btn.innerHTML = '<span class="material-icons-round fs-16">grid_view</span> Grid';
      } else {
        viewMode = 'grid';
        listEl.style.display = 'none';
        gridEl.style.display = 'grid';
        btn.innerHTML = '<span class="material-icons-round fs-16">view_list</span> Senarai';
      }
    }

    document.addEventListener('DOMContentLoaded', initRentedCars);
  </script>
</body>

</html>

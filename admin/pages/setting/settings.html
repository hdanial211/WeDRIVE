<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png" />
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <link rel="stylesheet" href="../../../shared/css/wedrive.css?v=5.5.6" />
  <script src="../../../shared/js/auth-guard.js" data-role="admin"></script>
</head>
<body data-particles="6" data-cursor-glow>
  <div id="sidebar-placeholder" data-component="sidebar-admin" data-page="settings"></div>

  <main class="main">
    <div id="navbar-placeholder" data-module="admin"></div>

    <div class="content">
      <!-- HERO HEADER -->
      <div class="settings-hero reveal-onload">
        <h2 data-key="st_company_settings">System Settings</h2>
        <p>Manage company details, operational configurations, tax values, and rental rules.</p>
        <span class="material-icons-round hero-icon">settings</span>
      </div>

      <div class="settings-grid">
        <!-- COMPANY DETAILS -->
        <div class="settings-card reveal-onload">
          <div class="settings-header">
            <span class="material-icons-round">business</span>
            <h3 data-key="st_company_title">Company Details</h3>
          </div>
          <div class="form-grid-custom">
            <div class="form-group">
              <label for="st-name" data-key="st_name">Company Name</label>
              <div class="input-wrap-sm">
                <span class="material-icons-round">business</span>
                <input type="text" id="st-name" placeholder="Company Name" title="Company Name" />
              </div>
            </div>
            <div class="form-group">
              <label for="st-email" data-key="st_email">Email</label>
              <div class="input-wrap-sm">
                <span class="material-icons-round">email</span>
                <input type="email" id="st-email" placeholder="Email Address" title="Email Address" />
              </div>
            </div>
            <div class="form-group">
              <label for="st-phone" data-key="st_phone">Phone</label>
              <div class="input-wrap-sm">
                <span class="material-icons-round">phone</span>
                <input type="text" id="st-phone" placeholder="Phone Number" title="Phone Number" />
              </div>
            </div>
            <div class="form-group">
              <label for="st-address" data-key="st_address">Address</label>
              <div class="input-wrap-sm">
                <span class="material-icons-round">place</span>
                <input type="text" id="st-address" placeholder="Company Address" title="Company Address" />
              </div>
            </div>
          </div>
        </div>

        <!-- RENTAL SETTINGS -->
        <div class="settings-card reveal-on-scroll">
          <div class="settings-header">
            <span class="material-icons-round">rule</span>
            <h3 data-key="st_rental_title">Rental Configuration</h3>
          </div>
          <div class="form-grid-custom">
            <div class="grid-2col gap-16">
              <div class="form-group">
                <label for="st-currency" data-key="st_currency">Currency</label>
                <div class="input-wrap-sm">
                  <span class="material-icons-round">monetization_on</span>
                  <input type="text" id="st-currency" placeholder="e.g. RM" title="Currency" />
                </div>
              </div>
              <div class="form-group">
                <label for="st-tax" data-key="st_tax">Tax Rate (%)</label>
                <div class="input-wrap-sm">
                  <span class="material-icons-round">percent</span>
                  <input type="number" id="st-tax" placeholder="e.g. 6" title="Tax Rate (%)" />
                </div>
              </div>
            </div>
            
            <div class="grid-2col gap-16">
              <div class="form-group">
                <label for="st-min-days" data-key="st_min_days">Min Rental Days</label>
                <div class="input-wrap-sm">
                  <span class="material-icons-round">today</span>
                  <input type="number" id="st-min-days" placeholder="e.g. 1" title="Min Rental Days" />
                </div>
              </div>
              <div class="form-group">
                <label for="st-max-days" data-key="st_max_days">Max Rental Days</label>
                <div class="input-wrap-sm">
                  <span class="material-icons-round">date_range</span>
                  <input type="number" id="st-max-days" placeholder="e.g. 30" title="Max Rental Days" />
                </div>
              </div>
            </div>

            <div class="grid-2col gap-16">
              <div class="form-group">
                <label for="st-late-fee" data-key="st_late_fee">Late Fee (RM/hour)</label>
                <div class="input-wrap-sm">
                  <span class="material-icons-round">schedule</span>
                  <input type="number" id="st-late-fee" placeholder="e.g. 20" title="Late Fee (RM/hour)" />
                </div>
              </div>
              <div class="form-group">
                <label for="st-deposit" data-key="st_deposit">Deposit (%)</label>
                <div class="input-wrap-sm">
                  <span class="material-icons-round">savings</span>
                  <input type="number" id="st-deposit" placeholder="e.g. 10" title="Deposit (%)" />
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="st-hours" data-key="st_hours">Operating Hours</label>
              <div class="input-wrap-sm">
                <span class="material-icons-round">alarm</span>
                <input type="text" id="st-hours" placeholder="e.g. 08:00 - 22:00" title="Operating Hours" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- PICKUP LOCATIONS (Hidden by default or display:none, kept for compatibility) -->
      <div class="settings-card reveal-on-scroll mb-24 hidden">
        <div class="settings-header">
          <span class="material-icons-round">location_on</span>
          <h3 data-key="st_locations_title">Pick-up Locations</h3>
        </div>
        <div id="locations-list" class="d-flex flex-wrap gap-10"></div>
      </div>

      <!-- SAVE BUTTON -->
      <div class="reveal-on-scroll flex-end gap-12 mt-16">
        <button class="btn-primary-sm btn-save-settings" onclick="saveSettings()">
          <span class="material-icons-round fs-18">save</span>
          <span data-key="st_save">Save Changes</span>
        </button>
      </div>

      <!-- FOOTER -->
      <div id="footer-placeholder" class="mt-32"></div>
    </div>
  </main>

  <script src="../../../shared/js/navbar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/sidebar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/anime.min.js"></script>
  <script src="../../../shared/js/animate.js"></script>
  <script src="../../js/settings.js"></script>
</body>
</html>

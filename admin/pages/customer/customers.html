<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customers | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png" />
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <link rel="stylesheet" href="../../../shared/css/wedrive.css?v=5.5.2" />
  <script src="../../../shared/js/auth-guard.js" data-role="admin"></script>
</head>
<body data-particles="6" data-cursor-glow>
  <div id="sidebar-placeholder" data-component="sidebar-admin" data-page="customers-all"></div>

  <main class="main">
    <div id="navbar-placeholder" data-module="admin"></div>

    <div class="content">
      <!-- STATS -->
      <div class="stats-grid grid-4col">
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="cu_stat_total">Total Customers</div>
            <div class="value" id="cu-total">--</div>
          </div>
          <div class="stat-icon blue"><span class="material-icons-round">people</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="cu_stat_active">Active</div>
            <div class="value" id="cu-active">--</div>
          </div>
          <div class="stat-icon green"><span class="material-icons-round">person</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="cu_stat_inactive">Inactive</div>
            <div class="value" id="cu-inactive">--</div>
          </div>
          <div class="stat-icon amber"><span class="material-icons-round">person_off</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="cu_stat_spent">Total Spent</div>
            <div class="value fs-24" id="cu-spent">--</div>
          </div>
          <div class="stat-icon purple"><span class="material-icons-round">payments</span></div>
        </div>
      </div>

      <!-- SEARCH -->
      <div class="card reveal-on-scroll mb-20 px-22 py-16">
        <div class="flex-between flex-center gap-12">
          <div class="input-wrap-sm input-search-customer">
            <span class="material-icons-round fs-18">search</span>
            <input type="text" id="cu-search" placeholder="Search by name, email or phone..." oninput="searchCustomers(this.value)" />
          </div>
        </div>
      </div>

      <!-- PENDING VERIFICATIONS CARD -->
      <div class="card reveal-on-scroll pending-verifications-card hidden" id="pending-verifications-card">
        <div class="card-header border-bottom-subtle pb-12 mb-14">
          <h3 class="flex-center gap-8 text-amber">
            <span class="material-icons-round">pending_actions</span>
            <span>Pending Verifications</span>
          </h3>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>License</th>
                <th>Joined</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="pending-customers-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- TABLE -->
      <div class="card reveal-on-scroll">
        <div class="card-header">
          <h3 data-key="cu_table_title">Customer Records</h3>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th class="sortable" id="cu-th-name" onclick="sortByCustomer('name')" data-key="cu_th_name">Name</th>
                <th class="sortable" id="cu-th-email" onclick="sortByCustomer('email')" data-key="cu_th_email">Email</th>
                <th data-key="cu_th_phone">Phone</th>
                <th data-key="cu_th_license">License</th>
                <th class="sortable" id="cu-th-bookings" onclick="sortByCustomer('bookings')" data-key="cu_th_bookings">Bookings</th>
                <th class="sortable" id="cu-th-spent" onclick="sortByCustomer('spent')" data-key="cu_th_spent">Total Spent</th>
                <th data-key="cu_th_status">Status</th>
                <th class="sortable" id="cu-th-joined" onclick="sortByCustomer('joined')" data-key="cu_th_joined">Joined</th>
                <th data-key="cu_th_action">Action</th>
              </tr>
            </thead>
            <tbody id="customers-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- FOOTER -->
      <div id="footer-placeholder" class="mt-32"></div>
    </div>
  </main>

  <script src="../../../shared/js/navbar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/sidebar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/anime.min.js"></script>
  <script src="../../../shared/js/animate.js"></script>
  <script src="../../../shared/js/email-service.js"></script>
  <script src="../../js/customers.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png" />
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <link rel="stylesheet" href="../../../shared/css/wedrive.css" />
  <script src="../../../shared/js/auth-guard.js" data-role="admin"></script>
</head>
<body data-particles="6" data-cursor-glow>
  <div id="sidebar-placeholder" data-component="sidebar-admin" data-page="reports-summary"></div>

  <main class="main">
    <div id="navbar-placeholder" data-module="admin"></div>

    <div class="content">
      <!-- SUMMARY STATS -->
      <div class="stats-grid grid-4col">
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="rp_stat_revenue">Total Revenue</div>
            <div class="value fs-24" id="rp-revenue">--</div>
          </div>
          <div class="stat-icon blue"><span class="material-icons-round">payments</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="rp_stat_bookings">Total Bookings</div>
            <div class="value" id="rp-bookings">--</div>
          </div>
          <div class="stat-icon green"><span class="material-icons-round">receipt_long</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="rp_stat_avg">Avg Rental Days</div>
            <div class="value" id="rp-avg">--</div>
          </div>
          <div class="stat-icon amber"><span class="material-icons-round">timer</span></div>
        </div>
        <div class="stat-card reveal-onload">
          <div class="stat-info">
            <div class="label" data-key="rp_stat_rating">Satisfaction</div>
            <div class="value" id="rp-rating">--</div>
          </div>
          <div class="stat-icon purple"><span class="material-icons-round">star</span></div>
        </div>
      </div>

      <!-- CHARTS ROW -->
      <div class="grid-2">
        <!-- Monthly Revenue Chart -->
        <div class="card reveal-on-scroll">
          <div class="card-header">
            <h3 data-key="rp_chart_revenue">Monthly Revenue (RM)</h3>
          </div>
          <div id="revenue-chart" class="py-12"></div>
        </div>

        <!-- Car Utilization -->
        <div class="card reveal-on-scroll">
          <div class="card-header">
            <h3 data-key="rp_chart_util">Vehicle Utilization (%)</h3>
          </div>
          <div id="util-chart" class="py-12"></div>
        </div>
      </div>

      <!-- SUMMARY INFO -->
      <div class="card reveal-on-scroll">
        <div class="card-header">
          <h3 data-key="rp_summary_title">Performance Summary</h3>
          <div class="pos-relative">
            <button class="btn-primary-sm" id="export-btn" onclick="toggleExportDropdown(event)">
              <span class="material-icons-round fs-16">file_download</span>
              <span data-key="rp_export">Export Report</span>
            </button>
            <div id="export-dropdown" class="export-dropdown hidden">
              <button onclick="handleExport('csv')">
                <span class="material-icons-round">description</span> Export as CSV
              </button>
              <button onclick="handleExport('pdf')">
                <span class="material-icons-round">picture_as_pdf</span> Export as PDF
              </button>
            </div>
          </div>
        </div>
        <div class="grid-3col gap-20 mt-8">
          <div class="report-summary-card">
            <div class="report-summary-label" data-key="rp_popular_car">Most Popular Car</div>
            <div id="rp-popular" class="report-summary-val">--</div>
          </div>
          <div class="report-summary-card">
            <div class="report-summary-label" data-key="rp_busiest">Busiest Month</div>
            <div id="rp-busiest" class="report-summary-val">--</div>
          </div>
          <div class="report-summary-card">
            <div class="report-summary-label" data-key="rp_total_rev">Cumulative Revenue</div>
            <div id="rp-total-rev" class="report-summary-val">--</div>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <div id="footer-placeholder" class="mt-32"></div>
    </div>
  </main>

  <script src="../../../shared/js/navbar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/sidebar-loader.js?v=5.3.5"></script>
  <script src="../../../shared/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/anime.min.js"></script>
  <script src="../../../shared/js/animate.js"></script>
  <script src="../../js/reports.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png?v=2" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png?v=2" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <link rel="stylesheet" href="../../../shared/css/wedrive.css" />
  <style>
    .welcome-page-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background: var(--bg-body);
    }

    .welcome-bento {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      background: var(--bg-glass);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid var(--border-glass);
      border-radius: 32px;
      padding: 48px 36px 40px;
      box-shadow: var(--shadow-glass), 0 24px 60px rgba(0, 0, 0, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: welcomeCardEntrance 0.6s var(--ease-apple) forwards;
    }

    @keyframes welcomeCardEntrance {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .welcome-orb-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .welcome-orb-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 113, 227, 0.5) 0%, rgba(175, 82, 222, 0.35) 50%, transparent 70%);
      filter: blur(14px);
      animation: welcomeOrbPulse 3.6s ease-in-out infinite alternate;
    }

    @keyframes welcomeOrbPulse {
      0% {
        transform: scale(0.92);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    .welcome-orb-core {
      position: relative;
      z-index: 2;
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0071E3 0%, #5856D6 50%, #AF52DE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 10px 28px rgba(88, 86, 214, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .welcome-orb-core .material-icons-round {
      font-size: 38px;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
      animation: aiSparkleTwinkle 3.2s ease-in-out infinite;
    }

    .welcome-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      background: rgba(0, 113, 227, 0.08);
      border: 1px solid rgba(0, 113, 227, 0.2);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    html.night-mode .welcome-kicker,
    body.night-mode .welcome-kicker {
      background: rgba(41, 151, 255, 0.15);
      border-color: rgba(41, 151, 255, 0.35);
      color: #5AC8FA;
    }

    .welcome-title {
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--text-primary);
      line-height: 1.2;
      margin: 0;
    }

    .welcome-title .gradient-name {
      background: linear-gradient(135deg, #0071E3 0%, #5856D6 60%, #AF52DE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-lead {
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      max-width: 420px;
      margin: 0;
      font-weight: 450;
    }

    .welcome-progress-shell {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .welcome-progress-track {
      width: 100%;
      height: 6px;
      background: var(--bg-surface-3);
      border-radius: var(--radius-pill);
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-subtle);
    }

    .welcome-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0071E3 0%, #2997FF 50%, #5AC8FA 100%);
      border-radius: var(--radius-pill);
      box-shadow: 0 0 12px rgba(0, 113, 227, 0.6);
      transition: width 2.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .welcome-status-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.01em;
    }

    .welcome-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34C759;
      box-shadow: 0 0 6px rgba(52, 199, 89, 0.8);
      animation: statusDotPulse 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="guest-page" data-cursor-glow>
  <div class="welcome-page-shell">
    <div class="ambient-glow top-left" aria-hidden="true"></div>
    <div class="ambient-glow bottom-right" aria-hidden="true"></div>

    <main class="welcome-bento">
      <div class="welcome-orb-wrap">
        <div class="welcome-orb-glow"></div>
        <div class="welcome-orb-core">
          <span class="material-icons-round">auto_awesome</span>
        </div>
      </div>

      <span class="welcome-kicker" id="welcome-kicker-label">
        <span class="material-icons-round" style="font-size: 15px;">verified</span>
        <span id="kicker-text">PENGESAHAN BERJAYA</span>
      </span>

      <h1 class="welcome-title" id="welcome-heading">
        Selamat Kembali, <br /><span id="welcome-user-name" class="gradient-name">USER</span>
      </h1>

      <p class="welcome-lead" id="welcome-subtitle">
        Menyediakan papan pemuka AI peribadi dan pengesyoran kenderaan pintar anda...
      </p>

      <div class="welcome-progress-shell">
        <div class="welcome-progress-track">
          <div class="welcome-progress-bar" id="welcome-progress-bar"></div>
        </div>
        <div class="welcome-status-text">
          <div class="welcome-status-dot"></div>
          <span id="welcome-status-label">Menyelaraskan profil pintar...</span>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      var currentLang = localStorage.getItem('wedrive_language') || 'ms';
      var isMs = currentLang === 'ms';

      // Parse user session
      var sessionRaw = localStorage.getItem('wedrive_session');
      var name = isMs ? 'Pengguna' : 'User';
      var role = 'customer';

      if (sessionRaw) {
        try {
          var session = JSON.parse(sessionRaw);
          if (session.name) {
            name = session.name.split(' ')[0];
          } else if (session.username) {
            name = session.username;
          } else if (session.email) {
            name = session.email.split('@')[0];
          }
          role = session.role || 'customer';
        } catch (e) {
          console.error("Session parse error", e);
        }
      }

      // Populate text
      var nameEl = document.getElementById('welcome-user-name');
      var headingEl = document.getElementById('welcome-heading');
      var kickerTextEl = document.getElementById('kicker-text');
      var subtitleEl = document.getElementById('welcome-subtitle');
      var statusLabelEl = document.getElementById('welcome-status-label');

      if (nameEl) nameEl.textContent = name;

      if (!isMs) {
        if (headingEl) headingEl.innerHTML = 'Welcome Back, <br /><span id="welcome-user-name" class="gradient-name">' + name + '</span>';
        if (kickerTextEl) kickerTextEl.textContent = 'AUTHENTICATION SUCCESSFUL';
        if (subtitleEl) subtitleEl.textContent = 'Preparing your personalized AI dashboard and smart vehicle recommendations...';
        if (statusLabelEl) statusLabelEl.textContent = 'Synchronizing smart profile...';
      }

      // Animate progress bar
      var pBar = document.getElementById('welcome-progress-bar');
      setTimeout(function() {
        if (pBar) pBar.style.width = '100%';
      }, 80);

      // Determine redirect URL
      var redirectUrl = '../../../customer/pages/dashboard/customer.html';

      if (role === 'admin') {
        redirectUrl = '../../../admin/pages/dashboard/admin.html';
      } else {
        try {
          var sb = window.supabaseClient;
          if (sb) {
            var authSession = await sb.auth.getSession();
            if (authSession && authSession.data && authSession.data.session) {
              var uid = authSession.data.session.user.id;
              var profileCheck = await window.WeDriveAPI.checkProfileComplete(uid);

              if (!profileCheck.complete) {
                redirectUrl = '../complete-profile/complete-profile.html';
              } else if (profileCheck.status === 'Pending') {
                redirectUrl = '../verification-pending/verification-pending.html';
              } else if (profileCheck.status === 'Rejected') {
                redirectUrl = '../complete-profile/complete-profile.html';
              } else if (profileCheck.status === 'Verified') {
                redirectUrl = '../../../customer/pages/dashboard/customer.html';
              } else {
                redirectUrl = '../complete-profile/complete-profile.html';
              }
            }
          }
        } catch (err) {
          console.error('Profile check error:', err);
          redirectUrl = '../../../customer/pages/dashboard/customer.html';
        }
      }

      // Smooth exit transition after 2.4s
      setTimeout(function () {
        document.body.classList.add('page-is-leaving');
        setTimeout(function () {
          window.location.href = redirectUrl;
        }, 240);
      }, 2300);
    });
  </script>
</body>
</html>

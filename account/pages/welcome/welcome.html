<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png?v=2" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png?v=2" />
  
  <!-- Apple-Grade Typography: Inter Display & Authentic Cursive Hello Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/wedrive.css" />

  <style>
    /* ==============================================================================
       AUTHENTIC APPLE "HELLO" / SETUP ASSISTANT WELCOME EXPERIENCE
       ============================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.apple-oobe-screen {
      min-height: 100vh;
      width: 100vw;
      background-color: #F5F5F7;
      color: #1D1D1F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      user-select: none;
      transition: background-color 0.4s var(--ease-apple), color 0.4s var(--ease-apple);
    }

    /* Dark Mode / Night Mode (Pure OLED Studio Black) */
    html.night-mode body.apple-oobe-screen,
    body.apple-oobe-screen.night-mode {
      background-color: #000000 !important;
      color: #F5F5F7 !important;
    }

    /* Subtle Atmospheric Studio Vignette */
    .apple-stage-backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(0, 113, 227, 0.04) 0%, transparent 60%);
      transition: opacity 0.4s ease;
    }

    html.night-mode .apple-stage-backdrop,
    body.night-mode .apple-stage-backdrop {
      background: radial-gradient(circle at 50% 45%, rgba(41, 151, 255, 0.08) 0%, transparent 65%);
    }

    /* Center Stage Container */
    .apple-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      max-width: 540px;
      width: 100%;
    }

    /* WeDRIVE Minimal Monogram */
    .apple-logo-wrap {
      margin-bottom: 24px;
      opacity: 0;
      transform: scale(0.92);
      animation: appleLogoIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    @keyframes appleLogoIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .apple-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.06);
      color: #1D1D1F;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    html.night-mode .apple-brand-badge,
    body.night-mode .apple-brand-badge {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      color: #F5F5F7;
    }

    .apple-brand-badge img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    /* The Iconic "hello" Multi-Language Morphing Script */
    .apple-hello-container {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 12px;
    }

    .apple-hello-script {
      font-family: 'Caveat', cursive;
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #1D1D1F 30%, #434344 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: absolute;
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html.night-mode .apple-hello-script,
    body.night-mode .apple-hello-script {
      background: linear-gradient(135deg, #FFFFFF 30%, #A1A1A6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .apple-hello-script.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .apple-hello-script.leaving {
      opacity: 0;
      transform: translateY(-12px) scale(1.03);
    }

    /* Clean Apple Display Subheadline */
    .apple-display-name {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #1D1D1F;
      line-height: 1.25;
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(10px);
      animation: appleNameIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    html.night-mode .apple-display-name,
    body.night-mode .apple-display-name {
      color: #F5F5F7;
    }

    @keyframes appleNameIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .apple-display-name .user-highlight {
      font-weight: 700;
      color: #0071E3;
    }

    html.night-mode .apple-display-name .user-highlight,
    body.night-mode .apple-display-name .user-highlight {
      color: #2997FF;
    }

    /* Minimalist Apple Liquid Progress Bar (macOS / iOS Signature) */
    .apple-progress-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 220px;
      opacity: 0;
      transform: translateY(8px);
      animation: appleProgressIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
    }

    @keyframes appleProgressIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .apple-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    html.night-mode .apple-progress-track,
    body.night-mode .apple-progress-track {
      background: rgba(255, 255, 255, 0.16);
    }

    .apple-progress-liquid {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: #0071E3;
      border-radius: 999px;
      transition: width 2.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html.night-mode .apple-progress-liquid,
    body.night-mode .apple-progress-liquid {
      background: #2997FF;
      box-shadow: 0 0 10px rgba(41, 151, 255, 0.5);
    }

    /* Quiet Apple Status Text */
    .apple-status-caption {
      font-size: 13.5px;
      font-weight: 400;
      color: #86868B;
      letter-spacing: -0.01em;
      transition: opacity 0.3s ease;
    }

    html.night-mode .apple-status-caption,
    body.night-mode .apple-status-caption {
      color: #A1A1A6;
    }

    /* Bottom Minimalist Security/Privacy Notice */
    .apple-footer-note {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #86868B;
      letter-spacing: -0.005em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      animation: appleFooterIn 0.8s ease 0.6s forwards;
    }

    @keyframes appleFooterIn {
      to {
        opacity: 0.75;
      }
    }

    .apple-footer-note .material-icons-round {
      font-size: 14px;
    }

    /* Cinematic Exit Dissolve */
    body.apple-oobe-screen.page-is-leaving {
      opacity: 0 !important;
      transform: scale(1.015) !important;
      filter: blur(4px) !important;
      transition: opacity 0.32s cubic-bezier(0.32, 0.72, 0, 1),
                  transform 0.32s cubic-bezier(0.32, 0.72, 0, 1),
                  filter 0.32s cubic-bezier(0.32, 0.72, 0, 1) !important;
    }
  </style>
</head>
<body class="apple-oobe-screen" data-cursor-glow>
  <div class="apple-stage-backdrop"></div>

  <main class="apple-stage">
    <!-- Clean WeDRIVE Monogram Pill -->
    <div class="apple-logo-wrap">
      <div class="apple-brand-badge">
        <img src="../../../shared/logo/wedrive-icon.png?v=2" alt="WeDRIVE" />
        <span>WeDRIVE</span>
      </div>
    </div>

    <!-- The Iconic Apple "hello" Multi-Language Sequence -->
    <div class="apple-hello-container" aria-live="polite">
      <span class="apple-hello-script active" id="hello-1">hello</span>
      <span class="apple-hello-script" id="hello-2">selamat datang</span>
      <span class="apple-hello-script" id="hello-3">welcome</span>
      <span class="apple-hello-script" id="hello-4">ciao</span>
    </div>

    <!-- Personalized Apple Subtitle -->
    <h1 class="apple-display-name" id="apple-display-title">
      Selamat Kembali, <span class="user-highlight" id="user-display-name">Hakim</span>
    </h1>

    <!-- Minimalist Apple Progress Bar -->
    <div class="apple-progress-box">
      <div class="apple-progress-track">
        <div class="apple-progress-liquid" id="apple-liquid-fill"></div>
      </div>
      <p class="apple-status-caption" id="apple-status-text">Menyediakan ruang pemanduan anda...</p>
    </div>
  </main>

  <!-- Apple Privacy / Security Footnote -->
  <div class="apple-footer-note">
    <span class="material-icons-round">lock</span>
    <span id="apple-security-note">Disulitkan dengan teknologi keselamatan WeDRIVE Secure ID</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      var currentLang = localStorage.getItem('wedrive_language') || 'ms';
      var isMs = currentLang === 'ms';

      // Parse user session
      var sessionRaw = localStorage.getItem('wedrive_session');
      var name = isMs ? 'Pengguna' : 'User';
      var role = 'customer';

      if (sessionRaw) {
        try {
          var session = JSON.parse(sessionRaw);
          if (session.name) {
            name = session.name.split(' ')[0];
          } else if (session.username) {
            name = session.username;
          } else if (session.email) {
            name = session.email.split('@')[0];
          }
          role = session.role || 'customer';
        } catch (e) {
          console.error("Session parse error", e);
        }
      }

      // Populate personalized name
      var userNameEl = document.getElementById('user-display-name');
      var titleEl = document.getElementById('apple-display-title');
      var statusEl = document.getElementById('apple-status-text');
      var securityNoteEl = document.getElementById('apple-security-note');

      if (userNameEl) userNameEl.textContent = name;

      if (!isMs) {
        if (titleEl) titleEl.innerHTML = 'Welcome Back, <span class="user-highlight">' + name + '</span>';
        if (statusEl) statusEl.textContent = 'Setting up your driving space...';
        if (securityNoteEl) securityNoteEl.textContent = 'Protected by WeDRIVE Secure ID encryption';
      }

      // Animate Hello script sequence (Apple Setup Assistant Style)
      var helloScripts = [
        document.getElementById('hello-1'),
        document.getElementById('hello-2'),
        document.getElementById('hello-3'),
        document.getElementById('hello-4')
      ].filter(Boolean);

      var currentIndex = 0;
      var helloInterval = setInterval(function () {
        if (helloScripts.length < 2) return;
        var prevEl = helloScripts[currentIndex];
        currentIndex = (currentIndex + 1) % helloScripts.length;
        var nextEl = helloScripts[currentIndex];

        if (prevEl) {
          prevEl.classList.remove('active');
          prevEl.classList.add('leaving');
          setTimeout(function () {
            prevEl.classList.remove('leaving');
          }, 450);
        }

        if (nextEl) {
          nextEl.classList.add('active');
        }
      }, 950);

      // Smooth progress liquid fill
      var liquidBar = document.getElementById('apple-liquid-fill');
      setTimeout(function () {
        if (liquidBar) liquidBar.style.width = '100%';
      }, 100);

      // Determine redirect destination
      var redirectUrl = '../../../customer/pages/dashboard/customer.html';

      if (role === 'admin') {
        redirectUrl = '../../../admin/pages/dashboard/admin.html';
      } else {
        try {
          var sb = window.supabaseClient;
          if (sb) {
            var authSession = await sb.auth.getSession();
            if (authSession && authSession.data && authSession.data.session) {
              var uid = authSession.data.session.user.id;
              var profileCheck = await window.WeDriveAPI.checkProfileComplete(uid);

              if (!profileCheck.complete) {
                redirectUrl = '../complete-profile/complete-profile.html';
              } else if (profileCheck.status === 'Pending') {
                redirectUrl = '../verification-pending/verification-pending.html';
              } else if (profileCheck.status === 'Rejected') {
                redirectUrl = '../complete-profile/complete-profile.html';
              } else if (profileCheck.status === 'Verified') {
                redirectUrl = '../../../customer/pages/dashboard/customer.html';
              } else {
                redirectUrl = '../complete-profile/complete-profile.html';
              }
            }
          }
        } catch (err) {
          console.error('Profile check error:', err);
          redirectUrl = '../../../customer/pages/dashboard/customer.html';
        }
      }

      // Smooth cinematic Apple exit dissolve after 2.8s
      setTimeout(function () {
        clearInterval(helloInterval);
        document.body.classList.add('page-is-leaving');
        setTimeout(function () {
          window.location.href = redirectUrl;
        }, 320);
      }, 2750);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Welcome | WeDRIVE</title>
  <link rel="icon" type="image/png" href="../../../shared/logo/wedrive-icon.png?v=2" />
  <link rel="apple-touch-icon" href="../../../shared/logo/wedrive-icon.png?v=2" />
  
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="../../../shared/css/wedrive.css" />

  <style>
    /* ==============================================================================
       WEDRIVE LUMINA — AUTHENTIC APPLE INTELLIGENCE ONBOARDING SCREEN
       ============================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.apple-lumina-welcome {
      min-height: 100vh;
      width: 100vw;
      background-color: var(--bg-body, #FBFBFD);
      color: var(--text-primary, #1D1D1F);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      user-select: none;
      padding: 40px 24px;
      transition: background-color 0.4s var(--ease-apple), color 0.4s var(--ease-apple);
    }

    html.night-mode body.apple-lumina-welcome,
    body.apple-lumina-welcome.night-mode {
      background-color: #000000 !important;
      color: #F5F5F7 !important;
    }

    /* Ambient Glow Backdrop */
    .lumina-ambient-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lumina-ambient-orb {
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 113, 227, 0.12) 0%, rgba(88, 86, 214, 0.06) 45%, transparent 70%);
      filter: blur(80px);
      animation: luminaOrbPulse 4.5s ease-in-out infinite alternate;
    }

    html.night-mode .lumina-ambient-orb,
    body.night-mode .lumina-ambient-orb {
      background: radial-gradient(circle, rgba(41, 151, 255, 0.16) 0%, rgba(175, 82, 222, 0.1) 45%, transparent 70%);
    }

    @keyframes luminaOrbPulse {
      0% {
        transform: scale(0.92);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    /* Top Empty Spacer for True Vertical Balance */
    .lumina-top-spacer {
      flex: 1;
    }

    /* Centerpiece Stage */
    .lumina-center-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 480px;
      width: 100%;
      gap: 28px;
      animation: luminaCardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes luminaCardIn {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Apple Intelligence Radiant Lumina Ring */
    .lumina-ring-assembly {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lumina-intelligence-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(from 0deg at 50% 50%, #0071E3, #5856D6, #AF52DE, #FF2D55, #FF9500, #0071E3);
      filter: blur(12px);
      opacity: 0.85;
      animation: luminaRingSpin 7s linear infinite;
      -webkit-mask: radial-gradient(transparent 58%, black 65%);
      mask: radial-gradient(transparent 58%, black 65%);
    }

    @keyframes luminaRingSpin {
      100% {
        transform: rotate(360deg);
      }
    }

    .lumina-core-capsule {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      border-radius: 30px;
      background: var(--bg-glass, rgba(255, 255, 255, 0.85));
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid var(--border-glass, rgba(255, 255, 255, 0.6));
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    html.night-mode .lumina-core-capsule,
    body.night-mode .lumina-core-capsule {
      background: rgba(24, 24, 28, 0.85);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .lumina-core-capsule img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 113, 227, 0.3));
    }

    /* Minimalist Typography */
    .lumina-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .lumina-title {
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--text-primary, #1D1D1F);
      line-height: 1.2;
      margin: 0;
    }

    html.night-mode .lumina-title,
    body.night-mode .lumina-title {
      color: #F5F5F7;
    }

    .lumina-title .user-name-highlight {
      font-weight: 800;
      color: #0071E3;
    }

    html.night-mode .lumina-title .user-name-highlight,
    body.night-mode .lumina-title .user-name-highlight {
      color: #2997FF;
    }

    .lumina-subtext {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-secondary, #86868B);
      letter-spacing: -0.01em;
      line-height: 1.5;
      margin: 0;
    }

    html.night-mode .lumina-subtext,
    body.night-mode .lumina-subtext {
      color: #A1A1A6;
    }

    /* iOS / macOS Fluid Progress Bar */
    .lumina-progress-track {
      width: 200px;
      height: 3.5px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-top: 4px;
    }

    html.night-mode .lumina-progress-track,
    body.night-mode .lumina-progress-track {
      background: rgba(255, 255, 255, 0.12);
    }

    .lumina-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: #0071E3;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(0, 113, 227, 0.6);
      transition: width 2.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html.night-mode .lumina-progress-fill,
    body.night-mode .lumina-progress-fill {
      background: #2997FF;
      box-shadow: 0 0 12px rgba(41, 151, 255, 0.8);
    }

    /* Bottom Secure Session Capsule */
    .lumina-footer {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
    }

    .lumina-security-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--bg-glass, rgba(255, 255, 255, 0.7));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass, rgba(0, 0, 0, 0.05));
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      color: var(--text-muted, #86868B);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    html.night-mode .lumina-security-pill,
    body.night-mode .lumina-security-pill {
      background: rgba(24, 24, 28, 0.7);
      border-color: rgba(255, 255, 255, 0.08);
      color: #A1A1A6;
    }

    .lumina-security-pill .material-icons-round {
      font-size: 14px;
      color: #34C759;
    }

    /* Page Exit Transition */
    body.apple-lumina-welcome.page-is-leaving {
      opacity: 0 !important;
      transform: scale(1.012) !important;
      filter: blur(4px) !important;
      transition: opacity 0.3s cubic-bezier(0.32, 0.72, 0, 1),
                  transform 0.3s cubic-bezier(0.32, 0.72, 0, 1),
                  filter 0.3s cubic-bezier(0.32, 0.72, 0, 1) !important;
    }
  </style>
</head>
<body class="apple-lumina-welcome" data-cursor-glow>
  <div class="lumina-ambient-backdrop">
    <div class="lumina-ambient-orb"></div>
  </div>

  <div class="lumina-top-spacer"></div>

  <main class="lumina-center-stage">
    <!-- Apple Intelligence Lumina Radiant Ring Assembly -->
    <div class="lumina-ring-assembly">
      <div class="lumina-intelligence-ring"></div>
      <div class="lumina-core-capsule">
        <img src="../../../shared/logo/wedrive-icon.png?v=2" alt="WeDRIVE" />
      </div>
    </div>

    <!-- Clean Apple Typography -->
    <div class="lumina-copy">
      <h1 class="lumina-title" id="welcome-title">
        Selamat Kembali, <span class="user-name-highlight" id="user-display-name">Hakim</span>
      </h1>
      <p class="lumina-subtext" id="welcome-subtext">
        Menyediakan papan pemuka & kenderaan anda...
      </p>
    </div>

    <!-- iOS Fluid Progress Bar -->
    <div class="lumina-progress-track">
      <div class="lumina-progress-fill" id="lumina-progress-fill"></div>
    </div>
  </main>

  <!-- Bottom Apple Secure Session Pill -->
  <div class="lumina-footer">
    <div class="lumina-security-pill">
      <span class="material-icons-round">verified_user</span>
      <span id="welcome-security-text">Sesi Selamat · WeDRIVE Secure ID</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../shared/js/supabase-config.js"></script>
  <script src="../../../shared/js/api.js"></script>
  <script src="../../../shared/js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      var currentLang = localStorage.getItem('wedrive_language') || 'ms';
      var isMs = currentLang === 'ms';

      // Parse user session
      var sessionRaw = localStorage.getItem('wedrive_session');
      var name = isMs ? 'Pengguna' : 'User';
      var role = 'customer';

      if (sessionRaw) {
        try {
          var session = JSON.parse(sessionRaw);
          if (session.name) {
            name = session.name.split(' ')[0];
          } else if (session.username) {
            name = session.username;
          } else if (session.email) {
            name = session.email.split('@')[0];
          }
          role = session.role || 'customer';
        } catch (e) {
          console.error("Session parse error", e);
        }
      }

      // Populate personalized name
      var userNameEl = document.getElementById('user-display-name');
      var titleEl = document.getElementById('welcome-title');
      var subtextEl = document.getElementById('welcome-subtext');
      var securityTextEl = document.getElementById('welcome-security-text');

      if (userNameEl) userNameEl.textContent = name;

      if (!isMs) {
        if (titleEl) titleEl.innerHTML = 'Welcome Back, <span class="user-name-highlight">' + name + '</span>';
        if (subtextEl) subtextEl.textContent = 'Setting up your personalized dashboard & vehicles...';
        if (securityTextEl) securityTextEl.textContent = 'Secure Session · WeDRIVE Protected';
      }

      // Animate progress bar fill
      var progressFill = document.getElementById('lumina-progress-fill');
      setTimeout(function () {
        if (progressFill) progressFill.style.width = '100%';
      }, 100);

      // Determine redirect destination
      var redirectUrl = '../../../customer/pages/dashboard/customer.html';

      if (role === 'admin') {
        redirectUrl = '../../../admin/pages/dashboard/admin.html';
      } else {
        try {
          var sb = window.supabaseClient;
          if (sb) {
            var authSession = await sb.auth.getSession();
            if (authSession && authSession.data && authSession.data.session) {
              var uid = authSession.data.session.user.id;
              var profileCheck = await window.WeDriveAPI.checkProfileComplete(uid);

              if (!profileCheck.complete) {
                redirectUrl = '../complete-profile/complete-profile.html';
              } else if (profileCheck.status === 'Pending') {
                redirectUrl = '../verification-pending/verification-pending.html';
              } else if (profileCheck.status === 'Rejected') {
                redirectUrl = '../complete-profile/complete-profile.html';
              } else if (profileCheck.status === 'Verified') {
                redirectUrl = '../../../customer/pages/dashboard/customer.html';
              } else {
                redirectUrl = '../complete-profile/complete-profile.html';
              }
            }
          }
        } catch (err) {
          console.error('Profile check error:', err);
          redirectUrl = '../../../customer/pages/dashboard/customer.html';
        }
      }

      var isDebug = window.location.search.includes('debug=true');
      if (isDebug) {
        console.log("Welcome screen debug mode active - auto redirect paused");
        return;
      }

      // Smooth cinematic Apple exit dissolve after 3.2s
      setTimeout(function () {
        document.body.classList.add('page-is-leaving');
        setTimeout(function () {
          window.location.href = redirectUrl;
        }, 320);
      }, 3200);
    });
  </script>
</body>
</html>
